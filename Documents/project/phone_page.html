<!doctype html>
<!--
  phone_page.html — единственият екран, който телефонът вижда.

  Нарочно е един файл без нито една външна заявка: нито шрифт, нито библиотека,
  нито икона. Отваря се на училищен Wi-Fi и на мобилни данни, често върху заспал
  Render — всяка допълнителна заявка тук е още една възможност страницата да
  увисне наполовина. Затова и шрифтът е системният, а не Inter: една чужда буква
  не струва колкото 40 KB чакане.

  Снимката се прави от камерата НА ТЕЛЕФОНА (input capture), а не през
  getUserMedia в страницата. Причината е проста: производителят на телефона
  обработва кадъра далеч по-добре, а страница от учебник е точно този случай —
  дребен текст, който трябва да остане четим.

  Езикът идва като ?lang= в адреса, сложен от компютъра при рисуването на QR
  кода. Приложението е двуезично и телефонът е част от него — да проговори на
  български на дете, което ползва английския, значи екранът да изглежда чужд
  точно в мига, в който трябва да вдъхва доверие.
-->
<html lang="bg">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Climby</title>
<style>
  :root {
    --bg: #f7f7f8;
    --surface: #ffffff;
    --ink: #16161a;
    --ink-soft: #5c5c66;
    --line: #dededf;
    --accent: #16161a;
    --accent-ink: #ffffff;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      /* Никога чисто черно — на OLED текстът върху #000 трепти по ръбовете. */
      --bg: #0d0d10;
      --surface: #17171c;
      --ink: #f2f2f4;
      --ink-soft: #9a9aa4;
      --line: #2a2a32;
      --accent: #f2f2f4;
      --accent-ink: #0d0d10;
    }
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px 16px calc(20px + env(safe-area-inset-bottom));
  }
  main {
    width: 100%;
    max-width: 420px;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 18px;
    padding: 30px 22px 26px;
    text-align: center;
  }
  .brand {
    font-size: 12px;
    letter-spacing: .16em;
    text-transform: uppercase;
    color: var(--ink-soft);
    margin: 0 0 22px;
  }
  h1 { font-size: 22px; line-height: 1.25; margin: 0 0 10px; font-weight: 650; }
  p { margin: 0 0 16px; color: var(--ink-soft); }
  strong { color: var(--ink); font-weight: 600; }
  .code {
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    font-size: 34px;
    letter-spacing: .22em;
    font-weight: 600;
    color: var(--ink);
    margin: 6px 0;
    padding-left: .22em; /* компенсира разредката, за да е наистина центриран */
  }
  .code-hint { font-size: 14px; }
  button, .filebtn {
    display: block;
    width: 100%;
    font: inherit;
    font-weight: 600;
    border-radius: 12px;
    padding: 16px 18px;
    border: 1px solid var(--accent);
    background: var(--accent);
    color: var(--accent-ink);
    cursor: pointer;
    margin-top: 10px;
  }
  .ghost { background: transparent; color: var(--ink); border-color: var(--line); }
  button:disabled { opacity: .5; }
  /* Това копче се натиска отново и отново, често на ръка с молив в другата —
     затова е по-високо от останалите и стои само на реда си. */
  .filebtn { margin-top: 22px; padding: 20px 18px; font-size: 17px; }
  input[type=file] { position: absolute; width: 1px; height: 1px; opacity: 0; pointer-events: none; }
  .status { min-height: 22px; margin: 16px 0 0; font-size: 15px; }
  .dot {
    display: inline-block; width: 8px; height: 8px; border-radius: 50%;
    background: var(--ink); margin-right: 8px; vertical-align: middle;
  }
  .count { font-size: 14px; color: var(--ink-soft); margin: 12px 0 0; }
  .hidden { display: none !important; }
  .spin { animation: pulse 1.1s ease-in-out infinite; }
  @keyframes pulse { 0%,100% { opacity: 1 } 50% { opacity: .35 } }
  @media (prefers-reduced-motion: reduce) {
    .spin { animation: none; }
  }
</style>
</head>
<body>
<main>
  <p class="brand">Climby</p>

  <section id="loading">
    <p class="spin" data-i18n="loading">Зареждане…</p>
  </section>

  <section id="confirm" class="hidden">
    <h1 data-i18n="confirmTitle">Да свържа ли този телефон?</h1>
    <p id="confirmBody"></p>
    <div class="code" id="confirmCode"></div>
    <p class="code-hint" data-i18n="codeHint">Провери, че същият код се вижда и на компютъра.</p>
    <button id="confirmBtn" type="button" data-i18n="confirmBtn">Да, свържи телефона</button>
  </section>

  <section id="ready" class="hidden">
    <h1><span class="dot" aria-hidden="true"></span><span data-i18n="readyTitle">Свързан</span></h1>
    <p id="readyBody"></p>
    <label class="filebtn" for="shot" data-i18n="shootBtn">Снимай страница</label>
    <input id="shot" type="file" accept="image/*" capture="environment">
    <p class="status" id="status" role="status" aria-live="polite"></p>
    <p class="count" id="count"></p>
  </section>

  <section id="failed" class="hidden">
    <h1 id="failTitle"></h1>
    <p id="failText"></p>
    <button id="retryBtn" class="ghost" type="button" data-i18n="retryBtn">Опитай пак</button>
  </section>
</main>

<script>
(function () {
  'use strict';

  // ---------- език ----------
  var STR = {
    bg: {
      title: 'Climby — снимка от телефона',
      loading: 'Зареждане…',
      confirmTitle: 'Да свържа ли този телефон?',
      confirmBody: 'Ще изпраща снимки към профила на {name}.',
      codeHint: 'Провери, че същият код се вижда и на компютъра.',
      confirmBtn: 'Да, свържи телефона',
      confirmBtnBusy: 'Свързвам…',
      readyTitle: 'Свързан',
      readyBody: 'Снимай страница и тя ще се появи на компютъра на {name}.',
      shootBtn: 'Снимай страница',
      retryBtn: 'Опитай пак',
      waking: 'Сървърът се събужда…',
      sending: 'Изпращам…',
      sent: 'Готово — виж компютъра.',
      offline: 'Няма връзка. Опитай пак.',
      failedOnce: 'Не се получи. Опитай пак.',
      countOne: 'Изпратена 1 снимка',
      countMany: 'Изпратени {n} снимки',
      errNoCodeTitle: 'Липсва код',
      errNoCodeBody: 'Отвори QR кода от компютъра още веднъж.',
      errExpiredTitle: 'Кодът вече не важи',
      errExpiredBody: 'Покажи нов QR код на компютъра и го сканирай пак.',
      errPairTitle: 'Свързването не стана',
      errOfflineTitle: 'Няма връзка',
      errOfflineBody: 'Провери интернета и опитай пак.',
      errUnlinkedTitle: 'Телефонът е откачен',
      errUnlinkedBody: 'Свържи го отново от компютъра.',
    },
    en: {
      title: 'Climby — photo from your phone',
      loading: 'Loading…',
      confirmTitle: 'Link this phone?',
      confirmBody: "It will send photos to {name}'s account.",
      codeHint: 'Check that the same code is showing on your computer.',
      confirmBtn: 'Yes, link this phone',
      confirmBtnBusy: 'Linking…',
      readyTitle: 'Connected',
      readyBody: "Take a photo of a page and it will show up on {name}'s computer.",
      shootBtn: 'Photograph a page',
      retryBtn: 'Try again',
      waking: 'Waking the server…',
      sending: 'Sending…',
      sent: 'Done — check your computer.',
      offline: 'No connection. Try again.',
      failedOnce: "That didn't work. Try again.",
      countOne: '1 photo sent',
      countMany: '{n} photos sent',
      errNoCodeTitle: 'No code',
      errNoCodeBody: 'Open the QR code on your computer once more.',
      errExpiredTitle: 'This code is no longer valid',
      errExpiredBody: 'Show a new QR code on your computer and scan it again.',
      errPairTitle: 'Linking failed',
      errOfflineTitle: 'No connection',
      errOfflineBody: 'Check your internet and try again.',
      errUnlinkedTitle: 'This phone was unlinked',
      errUnlinkedBody: 'Link it again from your computer.',
    },
  };

  var params = new URLSearchParams(location.search);
  var lang = STR[params.get('lang')] ? params.get('lang') : 'bg';

  function t(key, vars) {
    var s = STR[lang][key] || STR.bg[key] || key;
    if (vars) {
      for (var k in vars) s = s.split('{' + k + '}').join(vars[k]);
    }
    return s;
  }

  // Изречение с име вътре, без innerHTML: шаблонът се реже на „{name}" и
  // средата се слага като <strong> с textContent. Името идва от сървъра, но
  // това няма значение — по този път разметка изобщо не може да влезе.
  function fillWithName(el, key, name) {
    var parts = t(key).split('{name}');
    el.textContent = '';
    el.appendChild(document.createTextNode(parts[0]));
    var strong = document.createElement('strong');
    strong.textContent = name;
    el.appendChild(strong);
    el.appendChild(document.createTextNode(parts[1] || ''));
  }

  document.documentElement.lang = lang;
  document.title = t('title');
  Array.prototype.forEach.call(document.querySelectorAll('[data-i18n]'), function (el) {
    el.textContent = t(el.getAttribute('data-i18n'));
  });

  // ---------- състояние ----------
  // Тайната от QR кода стои в адреса. Тя важи веднъж и десет минути — след
  // потвърждаване тук остава само токенът на устройството.
  var secret = decodeURIComponent(location.pathname.replace(/^\/p\//, '').replace(/\/$/, ''));
  var TOKEN_KEY = 'climby.device.token';
  var token = null;
  try { token = localStorage.getItem(TOKEN_KEY); } catch (e) { token = null; }

  var $ = function (id) { return document.getElementById(id); };
  var sent = 0;

  function show(name) {
    ['loading', 'confirm', 'ready', 'failed'].forEach(function (s) {
      $(s).classList.toggle('hidden', s !== name);
    });
  }

  function fail(titleKey, bodyKey, bodyText) {
    $('failTitle').textContent = t(titleKey);
    $('failText').textContent = bodyText || t(bodyKey);
    show('failed');
  }

  function setStatus(text, busy) {
    var el = $('status');
    el.textContent = text;
    el.classList.toggle('spin', !!busy);
  }

  function forgetToken() {
    try { localStorage.removeItem(TOKEN_KEY); } catch (e) { /* и без запис върви */ }
    token = null;
  }

  // Безплатният Render заспива след около 15 минути. Първата заявка тогава пада
  // или се връща като 502/503 от ръба — за човека това изглежда като счупено
  // приложение, макар да е само събуждане. Затова един повторен опит след пауза.
  function call(path, options, retried) {
    options = options || {};
    return fetch(path, options).then(function (res) {
      if (!retried && res.status >= 502 && res.status <= 504) {
        return wake().then(function () { return call(path, options, true); });
      }
      return res;
    }).catch(function (err) {
      if (retried) throw err;
      return wake().then(function () { return call(path, options, true); });
    });
  }

  function wake() {
    setStatus(t('waking'), true);
    return new Promise(function (r) { setTimeout(r, 4000); });
  }

  function detail(res) {
    return res.json().then(function (d) {
      return (d && typeof d.detail === 'string') ? d.detail : null;
    }).catch(function () { return null; });
  }

  // ---------- стъпка 1: още ли съм свързан ----------
  function checkExisting() {
    return call('/devices/me', { headers: { Authorization: 'Device ' + token } })
      .then(function (res) {
        if (!res.ok) {
          // Токенът е бил откачен от компютъра — забравяме го и минаваме по
          // обичайния път на поканата, ако адресът още носи такава.
          forgetToken();
          return askToPair();
        }
        return res.json().then(function (d) {
          fillWithName($('readyBody'), 'readyBody', d.user_display_name);
          show('ready');
        });
      });
  }

  // ---------- стъпка 2: поканата ----------
  function askToPair() {
    if (!secret) return fail('errNoCodeTitle', 'errNoCodeBody');
    return call('/devices/pair/' + encodeURIComponent(secret) + '/info').then(function (res) {
      if (!res.ok) {
        return detail(res).then(function (msg) {
          fail('errExpiredTitle', 'errExpiredBody', msg);
        });
      }
      return res.json().then(function (d) {
        fillWithName($('confirmBody'), 'confirmBody', d.display_name);
        $('confirmCode').textContent = d.confirm_code;
        show('confirm');
      });
    });
  }

  $('confirmBtn').addEventListener('click', function () {
    var btn = $('confirmBtn');
    btn.disabled = true;
    btn.textContent = t('confirmBtnBusy');
    call('/devices/pair/' + encodeURIComponent(secret) + '/claim', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ device_name: null }),
    }).then(function (res) {
      if (!res.ok) {
        return detail(res).then(function (msg) {
          fail('errPairTitle', 'errExpiredBody', msg);
        });
      }
      return res.json().then(function (d) {
        token = d.token;
        try { localStorage.setItem(TOKEN_KEY, token); } catch (e) { /* и без запис върви */ }
        fillWithName($('readyBody'), 'readyBody', d.user_display_name);
        show('ready');
      });
    }).catch(function () {
      fail('errOfflineTitle', 'errOfflineBody');
    }).then(function () {
      btn.disabled = false;
      btn.textContent = t('confirmBtn');
    });
  });

  $('retryBtn').addEventListener('click', function () { location.reload(); });

  // ---------- стъпка 3: снимане ----------
  // Същите числа като в frontend/scanner.js: моделът и без това гледа около
  // 1568 пиксела по дългата страна, а на мобилни данни разликата между 400 KB и
  // 4 MB е разликата между "веднага" и "предаде се".
  var MAX_DIM = 1568;
  var QUALITY = 0.82;

  function downscale(file) {
    return new Promise(function (resolve, reject) {
      var url = URL.createObjectURL(file);
      var img = new Image();
      img.onload = function () {
        URL.revokeObjectURL(url);
        var w = img.naturalWidth, h = img.naturalHeight;
        var scale = Math.min(1, MAX_DIM / Math.max(w, h));
        var canvas = document.createElement('canvas');
        canvas.width = Math.round(w * scale);
        canvas.height = Math.round(h * scale);
        var ctx = canvas.getContext('2d');
        ctx.imageSmoothingQuality = 'high';
        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
        var dataUrl = canvas.toDataURL('image/jpeg', QUALITY);
        resolve(dataUrl.slice(dataUrl.indexOf(',') + 1));
      };
      img.onerror = function () {
        URL.revokeObjectURL(url);
        reject(new Error('bad image'));
      };
      img.src = url;
    });
  }

  $('shot').addEventListener('change', function (e) {
    var file = e.target.files && e.target.files[0];
    e.target.value = '';  // същата снимка да може да се прати пак
    if (!file) return;

    setStatus(t('sending'), true);
    downscale(file).then(function (b64) {
      return call('/devices/photos', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', Authorization: 'Device ' + token },
        body: JSON.stringify({ image: b64 }),
      });
    }).then(function (res) {
      if (res.status === 401) {
        forgetToken();
        return fail('errUnlinkedTitle', 'errUnlinkedBody');
      }
      if (!res.ok) {
        return detail(res).then(function (msg) {
          setStatus(msg || t('failedOnce'), false);
        });
      }
      sent += 1;
      setStatus(t('sent'), false);
      $('count').textContent = sent === 1 ? t('countOne') : t('countMany', { n: sent });
    }).catch(function () {
      setStatus(t('offline'), false);
    });
  });

  // ---------- начало ----------
  (token ? checkExisting() : askToPair()).catch(function () {
    fail('errOfflineTitle', 'errOfflineBody');
  });
})();
</script>
</body>
</html>
