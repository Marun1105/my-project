<!doctype html>
<!--
  phone_page.html — единственият екран, който телефонът вижда.

  Нарочно е един файл без нито една външна заявка: нито шрифт, нито библиотека,
  нито икона. Отваря се на училищен Wi-Fi и на мобилни данни, често върху заспал
  Render — всяка допълнителна заявка тук е още една възможност страницата да
  увисне наполовина. Затова и шрифтът е системният, а не Inter: една чужда буква
  не струва колкото 40 KB чакане.

  Снимката се прави във визьор вътре в страницата (getUserMedia), а не през
  камерата на телефона. Причината е рамката: докато кадърът се вижда тук, човекът
  вижда и дали страницата е побрана цялата и права — а камерата на телефона връща
  готова снимка, върху която вече няма какво да се поправи.

  Плаща се с качество: getUserMedia дава кадър от видеопотока, без обработката,
  която производителят прави на истинската снимка. Затова искаме възможно
  най-голям кадър, а изрязването и изправянето остават на компютъра, който има
  opencv. И затова камерата на телефона остава като резервен път — при отказан
  достъп страницата не свършва в задънена улица, а показва стария бутон.

  Езикът идва като ?lang= в адреса, сложен от компютъра при рисуването на QR
  кода. Приложението е двуезично и телефонът е част от него — да проговори на
  български на дете, което ползва английския, значи екранът да изглежда чужд
  точно в мига, в който трябва да вдъхва доверие.
-->
<html lang="bg">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Climby</title>
<style>
  :root {
    --bg: #f7f7f8;
    --surface: #ffffff;
    --ink: #16161a;
    --ink-soft: #5c5c66;
    --line: #dededf;
    --accent: #16161a;
    --accent-ink: #ffffff;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      /* Никога чисто черно — на OLED текстът върху #000 трепти по ръбовете. */
      --bg: #0d0d10;
      --surface: #17171c;
      --ink: #f2f2f4;
      --ink-soft: #9a9aa4;
      --line: #2a2a32;
      --accent: #f2f2f4;
      --accent-ink: #0d0d10;
    }
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px 16px calc(20px + env(safe-area-inset-bottom));
  }
  main {
    width: 100%;
    max-width: 420px;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 18px;
    padding: 30px 22px 26px;
    text-align: center;
  }
  .brand {
    font-size: 12px;
    letter-spacing: .16em;
    text-transform: uppercase;
    color: var(--ink-soft);
    margin: 0 0 22px;
  }
  h1 { font-size: 22px; line-height: 1.25; margin: 0 0 10px; font-weight: 650; }
  p { margin: 0 0 16px; color: var(--ink-soft); }
  strong { color: var(--ink); font-weight: 600; }
  .code {
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    font-size: 34px;
    letter-spacing: .22em;
    font-weight: 600;
    color: var(--ink);
    margin: 6px 0;
    padding-left: .22em; /* компенсира разредката, за да е наистина центриран */
  }
  .code-hint { font-size: 14px; }
  button, .filebtn {
    display: block;
    width: 100%;
    font: inherit;
    font-weight: 600;
    border-radius: 12px;
    padding: 16px 18px;
    border: 1px solid var(--accent);
    background: var(--accent);
    color: var(--accent-ink);
    cursor: pointer;
    margin-top: 10px;
  }
  .ghost { background: transparent; color: var(--ink); border-color: var(--line); }
  button:disabled { opacity: .5; }
  /* Това копче се натиска отново и отново, често на ръка с молив в другата —
     затова е по-високо от останалите и стои само на реда си. */
  .filebtn { margin-top: 22px; padding: 20px 18px; font-size: 17px; }
  input[type=file] { position: absolute; width: 1px; height: 1px; opacity: 0; pointer-events: none; }
  .status { min-height: 22px; margin: 16px 0 0; font-size: 15px; }
  .dot {
    display: inline-block; width: 8px; height: 8px; border-radius: 50%;
    background: var(--ink); margin-right: 8px; vertical-align: middle;
  }
  .count { font-size: 14px; color: var(--ink-soft); margin: 12px 0 0; }
  /* ---------- визьор ---------- */
  .viewfinder {
    position: relative;
    margin: 18px 0 4px;
    border-radius: 14px;
    overflow: hidden;
    background: #0d0d10;   /* не чисто черно, както и другаде */
    /* Начално съотношение, докато потокът си каже истинското (виж loadedmetadata).
       Оттам нататък показаното и заснетото съвпадат — inset-ът на рамката иначе
       обещава изрязване по места, които в горния кадър са другаде. */
    aspect-ratio: 3 / 4;
    /* Под, за браузър без aspect-ratio: там височината става automatic и
       кутията се сплесква до нула, тоест визьорът просто не се вижда. */
    min-height: 260px;
  }
  .viewfinder video { width: 100%; height: 100%; object-fit: cover; display: block; }

  /* Ъглите са само указание накъде да се цели — истинските ръбове ги намира
     компютърът. Затова са четири скоби, а не затворен правоъгълник: затворената
     рамка обещава изрязване точно по нея, каквото тук не се случва. */
  .frame { position: absolute; inset: 7%; pointer-events: none; }
  .frame i {
    position: absolute; width: 28px; height: 28px;
    border: 3px solid rgba(255,255,255,.95);
    filter: drop-shadow(0 1px 3px rgba(0,0,0,.55));
  }
  .frame i:nth-child(1) { top: 0; left: 0;  border-right: 0; border-bottom: 0; border-radius: 8px 0 0 0; }
  .frame i:nth-child(2) { top: 0; right: 0; border-left: 0;  border-bottom: 0; border-radius: 0 8px 0 0; }
  .frame i:nth-child(3) { bottom: 0; left: 0;  border-right: 0; border-top: 0; border-radius: 0 0 0 8px; }
  .frame i:nth-child(4) { bottom: 0; right: 0; border-left: 0;  border-top: 0; border-radius: 0 0 8px 0; }

  /* Лъчът се движи само с transform и opacity — двете неща, които браузърът
     умее да върти без преизчисляване на разположението. На телефон това е
     разликата между анимация, която не се усеща, и такава, която топли ръката. */
  .sweeper { position: absolute; inset: 7%; overflow: hidden; pointer-events: none; }
  .sweeper i {
    position: absolute; left: 0; right: 0; top: 0; height: 100%;
    background: linear-gradient(to bottom,
      transparent 0, transparent calc(50% - 1px),
      rgba(255,255,255,.9) 50%,
      transparent calc(50% + 1px), transparent 100%);
    animation: sweep 2.8s ease-in-out infinite;
  }
  @keyframes sweep {
    0%   { transform: translateY(-50%); opacity: 0; }
    15%  { opacity: 1; }
    85%  { opacity: 1; }
    100% { transform: translateY(50%);  opacity: 0; }
  }

  .flash { position: absolute; inset: 0; background: #fff; opacity: 0; pointer-events: none; }
  .flash.on { animation: flash .28s ease-out; }
  @keyframes flash { from { opacity: .85 } to { opacity: 0 } }

  /* Кръгло копче, защото точно това означава „снимай" на всеки телефон — и
     защото пръстът го намира, без да се чете. */
  .shutter {
    width: 74px; height: 74px; border-radius: 50%;
    margin: 14px auto 0; padding: 0;
    border: 3px solid var(--line);
    background: var(--accent);
    position: relative;
    transition: transform .08s ease-out;
  }
  .shutter::after {
    content: ''; position: absolute; inset: 7px; border-radius: 50%;
    border: 2px solid var(--accent-ink); opacity: .5;
  }
  .shutter:active { transform: scale(.93); }
  .shutter:disabled { opacity: .5; }
  /* Лампата стои върху кадъра, защото там е погледът, когато потрябва —
     а потрябва в стая, в която страницата вече не се чете. */
  .torch {
    position: absolute; top: 10px; right: 10px;
    width: 44px; height: 44px; border-radius: 50%;
    margin: 0; padding: 0; font-size: 20px; line-height: 44px;
    border: 1px solid rgba(255,255,255,.35);
    background: rgba(13,13,16,.55);
    color: #fff;
    backdrop-filter: blur(4px);
  }
  .torch[aria-pressed="true"] { background: rgba(255,255,255,.9); color: #16161a; }
  /* Последната снимка, дребна: единственият начин човекът да види, че е снимал
     страницата, а не масата — компютърът може да е в другата стая. */
  .thumb {
    display: block; margin: 12px auto 0;
    width: 68px; height: 68px; object-fit: cover;
    border-radius: 10px; border: 1px solid var(--line);
  }
  .vf-hint { font-size: 14px; margin: 10px 0 0; }
  .hidden { display: none !important; }
  .spin { animation: pulse 1.1s ease-in-out infinite; }
  @keyframes pulse { 0%,100% { opacity: 1 } 50% { opacity: .35 } }
  @media (prefers-reduced-motion: reduce) {
    .spin { animation: none; }
    .sweeper i { animation: none; opacity: .55; }
    .shutter { transition: none; }
    .flash.on { animation: none; }
  }
</style>
</head>
<body>
<main>
  <p class="brand">Climby</p>

  <section id="loading">
    <p class="spin" data-i18n="loading">Зареждане…</p>
  </section>

  <section id="confirm" class="hidden">
    <h1 data-i18n="confirmTitle">Да свържа ли този телефон?</h1>
    <p id="confirmBody"></p>
    <div class="code" id="confirmCode"></div>
    <p class="code-hint" data-i18n="codeHint">Провери, че същият код се вижда и на компютъра.</p>
    <button id="confirmBtn" type="button" data-i18n="confirmBtn">Да, свържи телефона</button>
  </section>

  <section id="ready" class="hidden">
    <h1><span class="dot" aria-hidden="true"></span><span data-i18n="readyTitle">Свързан</span></h1>
    <p id="readyBody"></p>
    <div id="viewfinder" class="viewfinder hidden">
      <video id="view" playsinline muted autoplay></video>
      <div class="frame" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
      <div class="sweeper" aria-hidden="true"><i></i></div>
      <div id="flash" class="flash" aria-hidden="true"></div>
      <button id="torch" class="torch hidden" type="button" aria-pressed="false">&#9788;</button>
    </div>
    <p class="vf-hint hidden" id="vfHint" data-i18n="vfHint">Побери страницата в рамката.</p>
    <button id="shutter" class="shutter hidden" type="button" aria-label="Снимай страница"></button>

    <div id="fallback" class="hidden">
      <p class="vf-hint" id="fallbackHint" data-i18n="fallbackHint">Няма достъп до камерата в страницата — ползвай камерата на телефона.</p>
      <label class="filebtn" for="shot" data-i18n="shootBtn">Снимай страница</label>
      <input id="shot" type="file" accept="image/*" capture="environment">
    </div>
    <p class="status" id="status" role="status" aria-live="polite"></p>
    <img id="thumb" class="thumb hidden" alt="">
    <p class="count" id="count"></p>
  </section>

  <section id="failed" class="hidden">
    <h1 id="failTitle"></h1>
    <p id="failText"></p>
    <button id="retryBtn" class="ghost" type="button" data-i18n="retryBtn">Опитай пак</button>
  </section>
</main>

<script>
(function () {
  'use strict';

  // ---------- език ----------
  var STR = {
    bg: {
      title: 'Climby — снимка от телефона',
      loading: 'Зареждане…',
      confirmTitle: 'Да свържа ли този телефон?',
      confirmBody: 'Ще изпраща снимки към профила на {name}.',
      codeHint: 'Провери, че същият код се вижда и на компютъра.',
      confirmBtn: 'Да, свържи телефона',
      confirmBtnBusy: 'Свързвам…',
      readyTitle: 'Свързан',
      readyBody: 'Снимай страница и тя ще се появи на компютъра на {name}.',
      shootBtn: 'Снимай страница',
      retryBtn: 'Опитай пак',
      waking: 'Сървърът се събужда…',
      sending: 'Изпращам…',
      sent: 'Готово — виж компютъра.',
      offline: 'Няма връзка. Опитай пак.',
      failedOnce: 'Не се получи. Опитай пак.',
      countOne: 'Изпратена 1 снимка',
      countMany: 'Изпратени {n} снимки',
      errNoCodeTitle: 'Липсва код',
      errNoCodeBody: 'Отвори QR кода от компютъра още веднъж.',
      errExpiredTitle: 'Кодът вече не важи',
      errExpiredBody: 'Покажи нов QR код на компютъра и го сканирай пак.',
      errPairTitle: 'Свързването не стана',
      errOfflineTitle: 'Няма връзка',
      errOfflineBody: 'Провери интернета и опитай пак.',
      errUnlinkedTitle: 'Телефонът е откачен',
      errUnlinkedBody: 'Свържи го отново от компютъра.',
      vfHint: 'Побери страницата в рамката.',
      torchOn: 'Включи светлината',
      torchOff: 'Изключи светлината',
      lastShot: 'Последната изпратена снимка',
      fallbackHint: 'Няма достъп до камерата тук — ползвай камерата на телефона.',
    },
    en: {
      title: 'Climby — photo from your phone',
      loading: 'Loading…',
      confirmTitle: 'Link this phone?',
      confirmBody: "It will send photos to {name}'s account.",
      codeHint: 'Check that the same code is showing on your computer.',
      confirmBtn: 'Yes, link this phone',
      confirmBtnBusy: 'Linking…',
      readyTitle: 'Connected',
      readyBody: "Take a photo of a page and it will show up on {name}'s computer.",
      shootBtn: 'Photograph a page',
      retryBtn: 'Try again',
      waking: 'Waking the server…',
      sending: 'Sending…',
      sent: 'Done — check your computer.',
      offline: 'No connection. Try again.',
      failedOnce: "That didn't work. Try again.",
      countOne: '1 photo sent',
      countMany: '{n} photos sent',
      errNoCodeTitle: 'No code',
      errNoCodeBody: 'Open the QR code on your computer once more.',
      errExpiredTitle: 'This code is no longer valid',
      errExpiredBody: 'Show a new QR code on your computer and scan it again.',
      errPairTitle: 'Linking failed',
      errOfflineTitle: 'No connection',
      errOfflineBody: 'Check your internet and try again.',
      errUnlinkedTitle: 'This phone was unlinked',
      errUnlinkedBody: 'Link it again from your computer.',
      vfHint: 'Fit the whole page inside the frame.',
      torchOn: 'Turn the light on',
      torchOff: 'Turn the light off',
      lastShot: 'The last photo you sent',
      fallbackHint: "No camera access here — use your phone's camera instead.",
    },
  };

  var params = new URLSearchParams(location.search);
  var lang = STR[params.get('lang')] ? params.get('lang') : 'bg';

  function t(key, vars) {
    var s = STR[lang][key] || STR.bg[key] || key;
    if (vars) {
      for (var k in vars) s = s.split('{' + k + '}').join(vars[k]);
    }
    return s;
  }

  // Изречение с име вътре, без innerHTML: шаблонът се реже на „{name}" и
  // средата се слага като <strong> с textContent. Името идва от сървъра, но
  // това няма значение — по този път разметка изобщо не може да влезе.
  function fillWithName(el, key, name) {
    var parts = t(key).split('{name}');
    el.textContent = '';
    el.appendChild(document.createTextNode(parts[0]));
    var strong = document.createElement('strong');
    strong.textContent = name;
    el.appendChild(strong);
    el.appendChild(document.createTextNode(parts[1] || ''));
  }

  document.documentElement.lang = lang;
  document.title = t('title');
  Array.prototype.forEach.call(document.querySelectorAll('[data-i18n]'), function (el) {
    el.textContent = t(el.getAttribute('data-i18n'));
  });
  // Кръглото копче няма надпис — името му се чете само от екранен четец, затова
  // не минава по горния път и се задава отделно, но пак от същите преводи.
  // Нарочно getElementById, а не $: $ е var, присвоена по-долу, и тук е още
  // undefined. Извикването ѝ хвърляше TypeError още при вдигането на страницата
  // и екранът оставаше завинаги на „Зареждане…".
  document.getElementById('shutter').setAttribute('aria-label', t('shootBtn'));

  // ---------- състояние ----------
  // Тайната от QR кода стои в адреса. Тя важи веднъж и десет минути — след
  // потвърждаване тук остава само токенът на устройството.
  var secret = decodeURIComponent(location.pathname.replace(/^\/p\//, '').replace(/\/$/, ''));
  var TOKEN_KEY = 'climby.device.token';
  var token = null;
  try { token = localStorage.getItem(TOKEN_KEY); } catch (e) { token = null; }

  var $ = function (id) { return document.getElementById(id); };
  var sent = 0;

  function show(name) {
    ['loading', 'confirm', 'ready', 'failed'].forEach(function (s) {
      $(s).classList.toggle('hidden', s !== name);
    });
    // Паленето и гасенето стоят ТУК, а не при всяко извикване: екранът се сменя
    // от няколко места и едно забравено гасене оставя лампичката до камерата да
    // свети, докато телефонът е в джоба.
    if (name === 'ready') startCamera(); else stopCamera();
  }

  function fail(titleKey, bodyKey, bodyText) {
    $('failTitle').textContent = t(titleKey);
    $('failText').textContent = bodyText || t(bodyKey);
    show('failed');
  }

  function setStatus(text, busy) {
    var el = $('status');
    el.textContent = text;
    el.classList.toggle('spin', !!busy);
  }

  function forgetToken() {
    try { localStorage.removeItem(TOKEN_KEY); } catch (e) { /* и без запис върви */ }
    token = null;
  }

  // Безплатният Render заспива след около 15 минути. Първата заявка тогава пада
  // или се връща като 502/503 от ръба — за човека това изглежда като счупено
  // приложение, макар да е само събуждане. Затова един повторен опит след пауза.
  function call(path, options, retried) {
    options = options || {};
    return fetch(path, options).then(function (res) {
      if (!retried && res.status >= 502 && res.status <= 504) {
        return wake().then(function () { return call(path, options, true); });
      }
      return res;
    }).catch(function (err) {
      if (retried) throw err;
      return wake().then(function () { return call(path, options, true); });
    });
  }

  function wake() {
    setStatus(t('waking'), true);
    return new Promise(function (r) { setTimeout(r, 4000); });
  }

  function detail(res) {
    return res.json().then(function (d) {
      return (d && typeof d.detail === 'string') ? d.detail : null;
    }).catch(function () { return null; });
  }

  // ---------- стъпка 1: още ли съм свързан ----------
  function checkExisting() {
    return call('/devices/me', { headers: { Authorization: 'Device ' + token } })
      .then(function (res) {
        if (!res.ok) {
          // Токенът е бил откачен от компютъра — забравяме го и минаваме по
          // обичайния път на поканата, ако адресът още носи такава.
          forgetToken();
          return askToPair();
        }
        return res.json().then(function (d) {
          fillWithName($('readyBody'), 'readyBody', d.user_display_name);
          show('ready');
        });
      });
  }

  // ---------- стъпка 2: поканата ----------
  function askToPair() {
    if (!secret) return fail('errNoCodeTitle', 'errNoCodeBody');
    return call('/devices/pair/' + encodeURIComponent(secret) + '/info').then(function (res) {
      if (!res.ok) {
        return detail(res).then(function (msg) {
          fail('errExpiredTitle', 'errExpiredBody', msg);
        });
      }
      return res.json().then(function (d) {
        fillWithName($('confirmBody'), 'confirmBody', d.display_name);
        $('confirmCode').textContent = d.confirm_code;
        show('confirm');
      });
    });
  }

  $('confirmBtn').addEventListener('click', function () {
    var btn = $('confirmBtn');
    btn.disabled = true;
    btn.textContent = t('confirmBtnBusy');
    call('/devices/pair/' + encodeURIComponent(secret) + '/claim', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ device_name: null }),
    }).then(function (res) {
      if (!res.ok) {
        return detail(res).then(function (msg) {
          fail('errPairTitle', 'errExpiredBody', msg);
        });
      }
      return res.json().then(function (d) {
        token = d.token;
        try { localStorage.setItem(TOKEN_KEY, token); } catch (e) { /* и без запис върви */ }
        fillWithName($('readyBody'), 'readyBody', d.user_display_name);
        show('ready');
      });
    }).catch(function () {
      fail('errOfflineTitle', 'errOfflineBody');
    }).then(function () {
      btn.disabled = false;
      btn.textContent = t('confirmBtn');
    });
  });

  $('retryBtn').addEventListener('click', function () { location.reload(); });

  // ---------- стъпка 3: снимане ----------
  // Същите числа като в frontend/scanner.js: моделът и без това гледа около
  // 1568 пиксела по дългата страна, а на мобилни данни разликата между 400 KB и
  // 4 MB е разликата между "веднага" и "предаде се".
  var MAX_DIM = 1568;
  var QUALITY = 0.82;

  // Едно място, където кадърът става base64 — и визьорът, и файлът минават през
  // него. Две почти еднакви копия се разминават тихо: едното получава нов таван
  // за размера, другото остава със стария, и разликата се вижда чак когато
  // сървърът откаже по-голямата снимка.
  function encodeCanvas(canvas, maxDim, quality) {
    maxDim = maxDim || MAX_DIM;
    quality = quality || QUALITY;
    var w = canvas.width, h = canvas.height;
    var scale = Math.min(1, maxDim / Math.max(w, h));
    var out = canvas;
    if (scale < 1) {
      out = document.createElement('canvas');
      out.width = Math.round(w * scale);
      out.height = Math.round(h * scale);
      var ctx = out.getContext('2d');
      ctx.imageSmoothingQuality = 'high';
      ctx.drawImage(canvas, 0, 0, out.width, out.height);
    }
    var dataUrl = out.toDataURL('image/jpeg', quality);
    return dataUrl.slice(dataUrl.indexOf(',') + 1);
  }

  function canvasFromFile(file) {
    return new Promise(function (resolve, reject) {
      var url = URL.createObjectURL(file);
      var img = new Image();
      img.onload = function () {
        URL.revokeObjectURL(url);
        var canvas = document.createElement('canvas');
        canvas.width = img.naturalWidth;
        canvas.height = img.naturalHeight;
        canvas.getContext('2d').drawImage(img, 0, 0);
        resolve(canvas);
      };
      img.onerror = function () {
        URL.revokeObjectURL(url);
        reject(new Error('bad image'));
      };
      img.src = url;
    });
  }

  // ---------- визьор ----------
  var stream = null;      // живият поток, за да може да се спре
  var starting = null;    // висящото искане за достъп — вторият опит чака същия отговор
  var wantCamera = false; // още ли го иска екранът, когато потокът най-сетне дойде
  // Веднъж отказан достъп не се иска пак. Без това всяко връщане към раздела
  // вадеше въпроса за камерата отново — а човекът, който вече е казал „не",
  // получаваше същия въпрос при всяко заключване и отключване на телефона.
  var cameraBlocked = false;

  function stopTracks(s) { s.getTracks().forEach(function (tr) { tr.stop(); }); }

  // Непрекъснат фокус и лампа — и двете само ако апаратът ги умее. Минават през
  // advanced, защото там неразбраното се пропуска, вместо да провали цялото
  // искане: телефон без такава настройка трябва да даде камера, а не отказ.
  function applyCameraExtras(opened) {
    var track = opened.getVideoTracks()[0];
    if (!track) return;
    // .catch, а не try/catch: applyConstraints не хвърля, а връща отхвърлено
    // обещание. Апарат без непрекъснат фокус иначе оставя необработено
    // отхвърляне в конзолата при всяко пускане на камерата.
    Promise.resolve(track.applyConstraints({ advanced: [{ focusMode: 'continuous' }] }))
      .catch(function () { /* този апарат не умее такъв фокус — не е повод за нищо */ });

    var caps = track.getCapabilities ? track.getCapabilities() : {};
    var btn = $('torch');
    // Лампата се пали от нула при всяко пускане на потока: състоянието ѝ живее в
    // самия апарат, а той току-що е бил изгасен.
    btn.setAttribute('aria-pressed', 'false');
    btn.setAttribute('aria-label', t('torchOn'));
    btn.classList.toggle('hidden', !caps.torch);
  }

  $('torch').addEventListener('click', function () {
    if (!stream) return;
    var track = stream.getVideoTracks()[0];
    if (!track) return;
    var btn = $('torch');
    var on = btn.getAttribute('aria-pressed') !== 'true';
    Promise.resolve(track.applyConstraints({ advanced: [{ torch: on }] })).then(function () {
      btn.setAttribute('aria-pressed', on ? 'true' : 'false');
      btn.setAttribute('aria-label', on ? t('torchOff') : t('torchOn'));
    }).catch(function () {
      // Апаратът е обещал лампа и не я е дал — по-честно е копчето да изчезне,
      // отколкото да стои и да не прави нищо.
      btn.classList.add('hidden');
    });
  });

  function useFallback() {
    ['viewfinder', 'vfHint', 'shutter'].forEach(function (id) { $(id).classList.add('hidden'); });
    $('fallback').classList.remove('hidden');
  }

  function startCamera() {
    wantCamera = true;
    if (stream || starting || cameraBlocked) return;
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) { cameraBlocked = true; return useFallback(); }

    // Искаме възможно най-едрия кадър: визьорът вече ни струва обработката,
    // която телефонът прави на истинската снимка, а дребният печатен текст е
    // първото, което се губи. ideal, а не exact — телефон, който не може
    // толкова, трябва да даде каквото има, вместо да откаже изобщо.
    starting = navigator.mediaDevices.getUserMedia({
      video: {
        facingMode: { ideal: 'environment' },
        width: { ideal: 2560 },
        height: { ideal: 1440 },
      },
      audio: false,
    }).then(function (opened) {
      // Разрешението се чака дълго. Дотогава човекът може да е излязъл от
      // екрана — тогава потокът не е нужен на никого и се гаси веднага.
      if (!wantCamera) { stopTracks(opened); return; }
      stream = opened;
      var v = $('view');
      // Истинското съотношение на кадъра, а не предположеното: object-fit: cover
      // реже показаното, а нагоре се праща целият кадър. Изравним ли ги, рамката
      // казва истината — това, което човекът вижда в нея, е това, което тръгва.
      v.addEventListener('loadedmetadata', function () {
        if (v.videoWidth && v.videoHeight) {
          $('viewfinder').style.aspectRatio = v.videoWidth + ' / ' + v.videoHeight;
        }
      });
      v.srcObject = opened;
      applyCameraExtras(opened);
      var playing = v.play();
      if (playing && playing.catch) playing.catch(function () { /* autoplay ще го подкара */ });
      $('fallback').classList.add('hidden');
      ['viewfinder', 'vfHint', 'shutter'].forEach(function (id) { $(id).classList.remove('hidden'); });
    }).catch(function () {
      // Отказан достъп, зает апарат, браузър без права — не е задънена улица.
      cameraBlocked = true;
      useFallback();
    }).then(function () {
      starting = null;
    });
  }

  function stopCamera() {
    wantCamera = false;
    if (stream) { stopTracks(stream); stream = null; }
    $('torch').classList.add('hidden');
    $('torch').setAttribute('aria-pressed', 'false');
    var v = $('view');
    if (v) v.srcObject = null;
  }

  function grabFrame() {
    var v = $('view');
    if (!v || !v.videoWidth || !v.videoHeight) return null;
    var canvas = document.createElement('canvas');
    canvas.width = v.videoWidth;
    canvas.height = v.videoHeight;
    canvas.getContext('2d').drawImage(v, 0, 0);
    return canvas;
  }

  // ---------- пращане ----------
  var sending = false;

  function showThumb(canvas) {
    var img = $('thumb');
    img.src = 'data:image/jpeg;base64,' + encodeCanvas(canvas, 140, 0.6);
    img.alt = t('lastShot');
    img.classList.remove('hidden');
  }

  // Единственият вход към сървъра: и визьорът, и файлът стигат дотук с платно.
  function sendCanvas(canvas) {
    var done = sendPhoto(encodeCanvas(canvas));
    // Миниатюрата се показва чак след като снимката наистина е стигнала —
    // инак екранът твърди „ето какво изпратих" за нещо, което е паднало.
    // Затова sendPhoto връща дали е стигнала, а не просто че е приключило:
    // „приключило" е вярно и когато няма връзка.
    if (done) done.then(function (delivered) { if (delivered) showThumb(canvas); });
    return done;
  }

  function sendPhoto(b64) {
    if (sending) return;   // второ нетърпеливо натискане праща същата страница пак
    sending = true;
    var delivered = false;
    setStatus(t('sending'), true);
    $('shutter').disabled = true;
    return call('/devices/photos', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', Authorization: 'Device ' + token },
      body: JSON.stringify({ image: b64 }),
    }).then(function (res) {
      if (res.status === 401) {
        forgetToken();
        return fail('errUnlinkedTitle', 'errUnlinkedBody');
      }
      if (!res.ok) {
        return detail(res).then(function (msg) {
          setStatus(msg || t('failedOnce'), false);
        });
      }
      delivered = true;
      sent += 1;
      setStatus(t('sent'), false);
      $('count').textContent = sent === 1 ? t('countOne') : t('countMany', { n: sent });
    }).catch(function () {
      setStatus(t('offline'), false);
    }).then(function () {
      sending = false;
      $('shutter').disabled = false;
      return delivered;
    });
  }

  $('shutter').addEventListener('click', function () {
    var canvas = grabFrame();
    if (!canvas) { setStatus(t('failedOnce'), false); return; }
    var flash = $('flash');
    flash.classList.remove('on');
    void flash.offsetWidth;   // рестартира анимацията при бърза втора снимка
    flash.classList.add('on');
    sendCanvas(canvas);
  });

  // Камерата не бива да работи, докато екранът е скрит: телефонът отива в джоба
  // със заключен екран далеч по-често, отколкото страницата се затваря.
  document.addEventListener('visibilitychange', function () {
    if (document.hidden) stopCamera();
    else if (!$('ready').classList.contains('hidden')) startCamera();
  });
  window.addEventListener('pagehide', stopCamera);
  // Връщане с копчето „назад" вдига страницата от кеша, без да мине през
  // visibilitychange — без този ред визьорът остава черен и копчето не снима.
  window.addEventListener('pageshow', function () {
    if (!$('ready').classList.contains('hidden')) startCamera();
  });

  // Резервният път праща същото и по същия начин — само кадърът идва отвън.
  $('shot').addEventListener('change', function (e) {
    var file = e.target.files && e.target.files[0];
    e.target.value = '';  // същата снимка да може да се прати пак
    if (!file || sending) return;
    canvasFromFile(file).then(sendCanvas).catch(function () {
      setStatus(t('failedOnce'), false);
    });
  });

  // ---------- начало ----------
  (token ? checkExisting() : askToPair()).catch(function () {
    fail('errOfflineTitle', 'errOfflineBody');
  });
})();
</script>
</body>
</html>
