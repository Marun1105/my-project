# Наблюдател за Climby.
#
# На 3 септември 2026 базата изтече, бекендът падна и никой не разбра четири дни.
# Render прати три писма; и трите останаха непрочетени. Този файл сменя писмото,
# което се пропуска, с провален пуск в GitHub — той идва като известие и се вижда
# като червено на самото хранилище.
#
# На 5 октомври 2026 същото се повтори в друга форма: сървърът беше жив, базата —
# също, и този наблюдател светеше зелено единайсет дни, докато вътре в него
# вървеше код от 24 септември. Осем подавания стояха в GitHub и нито едно не
# работеше. Куката на Render се обажда и връща 200 — това значи "приех заявката",
# а не "построих". Провали ли се строежът, Render продължава да сервира старото и
# пише писмо, което пак никой не чете.
#
# Затова освен "жив ли си" се пита и "ти ли си": /healthz връща commit-а, от
# който е строен процесът (RENDER_GIT_COMMIT), и той се сравнява с main.
#
# Първият вариант на тази проверка сравняваше phone_page.html — и той би
# светел зелено през целите единайсет дни, защото този файл не се беше
# променял: дигестът му се мести само когато той бъде редактиран, а повечето
# деплои пипат само server.py. Същата грешка като броя маршрути, едно ниво
# по-надолу. Commit-ът се сменя при всеки деплой, без изключение.
#
# Нарочно не ползва външна услуга: няма нов акаунт, няма нов ключ, няма още едно
# място, което да изтече.
name: Жив ли е Climby

on:
  schedule:
    # На всеки 15 минути. GitHub бави графиците при натоварване — приемай ги като
    # "някъде там", не като часовник.
    - cron: '*/15 * * * *'
  workflow_dispatch:        # и на ръка, от раздела Actions

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # fetch-depth: 0 — с по подразбиране 1 единственият commit е без родител и
          # `git log -1 -- <path>` връща HEAD за всеки път, така че всяка
          # възраст по файл излиза равна на възрастта на HEAD.
          fetch-depth: 0

      - name: Питаме сървъра дали и базата му е жива
        run: |
          URL="https://my-project-0gyk.onrender.com/healthz"

          # Безплатният Render заспива. Първото събуждане отнема към минута, а
          # заспал сървър не е спрян сървър — затова три опита с дълъг срок и
          # чак тогава тревога. Инак наблюдателят вика "вълк" всяка сутрин и
          # спираш да го гледаш, което е по-лошо от никакъв наблюдател.
          for i in 1 2 3; do
            echo "--- опит $i ---"
            code=$(curl -s -o body.txt -w '%{http_code}' --max-time 90 "$URL" || echo 000)
            echo "HTTP $code"
            cat body.txt 2>/dev/null; echo

            if [ "$code" = "200" ] && grep -q '"db"[[:space:]]*:[[:space:]]*"ok"' body.txt; then
              echo "✅ сървърът и базата отговарят"
              exit 0
            fi

            # 503 значи "процесът е жив, базата не е" — това няма да се оправи
            # от чакане. Няма смисъл да опитваме пак.
            if [ "$code" = "503" ]; then
              echo "❌ базата не отговаря (сървърът е жив)"
              exit 1
            fi

            [ "$i" -lt 3 ] && sleep 30
          done

          echo "❌ сървърът не отговори след три опита"
          exit 1

      - name: А върви ли вътре това, което е в main
        run: |
          URL="https://my-project-0gyk.onrender.com/healthz"

          # Строежът на Render отнема минути. Наблюдател, който вика "вълк" върху
          # деплой в движение, е наблюдател, който спираш да гледаш. Чака се само
          # след подаване, което всъщност деплойва: само пътищата, които
          # deploy-backend.yml наблюдава. Подаване в docs или frontend не тръгва
          # към Render, така че не трябва да отлага проверката — иначе при равномерна
          # работа по хранилището тя не се случва никога.
          LAST=$(git log -1 --format=%ct -- \
                   "Documents/project" \
                   ":(exclude)Documents/project/frontend" \
                   ":(exclude)Documents/project/site" \
                   ":(exclude)Documents/project/docs" \
                   ":(exclude)Documents/project/desktop" \
                   ":(exclude)Documents/project/*.md" 2>/dev/null || true)
          if [ -n "$LAST" ]; then
            AGE=$(( $(date +%s) - LAST ))
            if [ "$AGE" -lt 1800 ]; then
              echo "⏳ последното деплойващо подаване е на $AGE секунди — проверяваме следващия път"
              exit 0
            fi
          fi

          # --fail: без него 502/503 страница при студен старт се разчита като
          # отговор и се докладва като "стар код" — грешната диагноза.
          if ! curl -sS --fail --compressed --max-time 90 "$URL" -o health.json; then
            echo "⚠️ /healthz не се изтегли; живостта вече мина, не вдигаме тревога за това"
            exit 0
          fi

          GOT=$(python3 -c "import json;print(json.load(open('health.json')).get('commit') or '')" 2>/dev/null || echo "")
          WANT=$(git rev-parse HEAD)

          if [ -z "$GOT" ]; then
            echo "⚠️ сървърът не дава commit — все още върви код отпреди тази проверка,"
            echo "   или RENDER_GIT_COMMIT липсва. Само това вече значи, че деплоят не е минал."
            exit 1
          fi

          echo "в main:      $WANT"
          echo "на сървъра: $GOT"

          if [ "$WANT" = "$GOT" ]; then
            echo "✅ сървърът върви с кода от main"
            exit 0
          fi

          echo "❌ сървърът е жив, но върви СТАР код — деплоят не е минал."
          echo "   Куката връща 200 и когато строежът после се провали, а Render"
          echo "   продължава да сервира стария — затова Actions е зелено, /healthz"
          echo "   е зелено, и нищо ново не работи."
          echo "   Render → Events → редът с Deploy failed → Check your deploy logs."
          exit 1
